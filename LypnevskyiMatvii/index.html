<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <header class="game-header">
        <div class="header-panel">
          <div class="counter flag-counter" aria-label="Залишилося прапорців">
            <span class="counter-icon">🚩</span>
            <span class="counter-value" id="flag-count">010</span>
          </div>

          <button type="button" class="new-game-btn" id="new-game-btn" aria-label="Нова гра">
            <span class="new-game-icon" aria-hidden="true">😀</span>
          </button>

          <div class="counter timer" aria-label="Час, що минув">
            <span class="counter-value" id="timer">000</span>
            <span class="counter-icon">⏱</span>
          </div>
        </div>
      </header>

      <section class="game-board" aria-label="Ігрове поле Сапера">
        <div class="board-grid" id="board-grid">

          <!-- Row 1 -->
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>

          <!-- Row 2 -->
          <div class="cell cell--open cell--empty" aria-label="Клітинка порожня"></div>
          <div class="cell cell--open cell--number cell--1" aria-label="Клітинка 1">1</div>
          <div class="cell cell--open cell--number cell--2" aria-label="Клітинка 2">2</div>
          <div class="cell cell--open cell--number cell--3" aria-label="Клітинка 3">3</div>
          <div class="cell cell--open cell--number cell--4" aria-label="Клітинка 4">4</div>
          <div class="cell cell--open cell--number cell--5" aria-label="Клітинка 5">5</div>
          <div class="cell cell--open cell--number cell--6" aria-label="Клітинка 6">6</div>
          <div class="cell cell--open cell--number cell--7" aria-label="Клітинка 7">7</div>
          <div class="cell cell--open cell--number cell--8" aria-label="Клітинка 8">8</div>

          <!-- Row 3 -->
          <div class="cell cell--flagged" aria-label="Клітинка з прапорцем"></div>
          <div class="cell cell--flagged cell--flagged-mine" aria-label="Клітинка з прапорцем і міною"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>

          <!-- Row 4 -->
          <div class="cell cell--mine" aria-label="Клітинка з міною"></div>
          <div class="cell cell--mine cell--mine-hit" aria-label="Клітинка з міною (натиснута)"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>

          <!-- Row 5 -->
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>

          <!-- Row 6 -->
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>

          <!-- Row 7 -->
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>

          <!-- Row 8 -->
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>

          <!-- Row 9 -->
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>
          <div class="cell cell--closed" aria-label="Клітинка закрита"></div>

        </div>
      </section>

      <footer class="game-legend">
        <h2 class="legend-title">Стани клітинок</h2>
        <ul class="legend-list">
          <li class="legend-item">
            <div class="cell cell--closed legend-cell"></div>
            <span>Закрита</span>
          </li>
          <li class="legend-item">
            <div class="cell cell--open cell--empty legend-cell"></div>
            <span>Відкрита порожня</span>
          </li>
          <li class="legend-item">
            <div class="cell cell--open cell--number cell--1 legend-cell">1</div>
            <span>Відкрита з числом</span>
          </li>
          <li class="legend-item">
            <div class="cell cell--flagged legend-cell"></div>
            <span>Прапорець (без міни)</span>
          </li>
          <li class="legend-item">
            <div class="cell cell--flagged cell--flagged-mine legend-cell"></div>
            <span>Прапорець (з міною)</span>
          </li>
          <li class="legend-item">
            <div class="cell cell--mine legend-cell"></div>
            <span>Міна</span>
          </li>
          <li class="legend-item">
            <div class="cell cell--mine cell--mine-hit legend-cell"></div>
            <span>Натиснута міна</span>
          </li>
        </ul>
      </footer>
    </main>
  </body>
</html>
