<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper – Візуальний інтерфейс</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="minesweeper" aria-label="Гра Сапер (візуальна частина)">
      <h1 class="minesweeper__title">Сапер</h1>

      <section class="minesweeper__header" aria-label="Панель керування">
        <div class="info-block" aria-label="Доступні прапорці">
          <span class="info-block__label">Прапорці</span>
          <div class="info-block__value info-block__value--danger">
            <span class="info-block__icon" aria-hidden="true">💣</span>
            <span id="flags-counter">010</span>
          </div>
        </div>

        <button class="btn-start" type="button" id="btn-start" aria-label="Старт/Рестарт гри">Старт</button>

        <div class="info-block" aria-label="Таймер">
          <span class="info-block__label">Час</span>
          <div class="info-block__value">
            <span class="info-block__icon" aria-hidden="true">⏱</span>
            <span id="timer-counter">000</span>
          </div>
        </div>
      </section>

      <p class="minesweeper__status" aria-live="polite"></p>

      <section
        class="minesweeper__board-wrapper"
        aria-label="Ігрове поле"
      >
        <div class="minesweeper__board" id="board" style="--cols: 8"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
