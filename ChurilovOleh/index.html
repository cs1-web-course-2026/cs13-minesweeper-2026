            <div class="mines-count" id="mines-display" title="Залишилось мін">010</div>
            <button class="reset-button" aria-label="Почати нову гру">🙂</button>
            <div class="timer" id="timer-display" title="Час гри">000</div>
        </header>

        <main class="game-board">
            <!-- Рядок 1 (9 клітинок) -->
            <button class="cell" aria-label="Клітинка порожня закрита"></button>
            <button class="cell opened text-1" aria-label="Відкрита клітинка 1 міна поруч">1</button>
            <button class="cell opened text-2" aria-label="Відкрита клітинка 2 міни поруч">2</button>
            <button class="cell opened" aria-label="Відкрита порожня клітинка"></button>

            <!-- Рядок 2 (9 клітинок) -->

            <button class="cell flagged-wrong" title="Неправильний прапорець" aria-label="Неправильно поставлений прапорець"></button>
            <button class="cell mine" title="Звичайна міна" aria-label="Клітинка з міною"></button>
            <button class="cell mine-exploded" title="Міна, на яку натиснули" aria-label="Вибух міни"></button>
            <button class="cell opened text-3" aria-label="Відкрита клітинка 3 міни поруч">3</button>
            <button class="cell opened text-4" aria-label="Відкрита клітинка 4 міни поруч">4</button>
            <button class="cell" aria-label="Клітинка порожня закрита"></button>
            <button class="cell" aria-label="Клітинка порожня закрита"></button>
            <button class="cell" aria-label="Клітинка порожня закрита"></button>
